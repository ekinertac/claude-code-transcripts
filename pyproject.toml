[project]
name = "claude-code-transcripts"
version = "0.6"
description = "Multi-agent coding-session manager and transcript viewer for claude, codex, pi, opencode, forge"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Ekin Ertaç" },
]
# Original transcript-rendering code by Simon Willison
# (https://github.com/simonw/claude-code-transcripts).
requires-python = ">=3.10"
dependencies = [
    "click",
    "click-default-group",
    "httpx",
    "jinja2",
    "markdown",
    "questionary",
]

[project.urls]
Homepage = "https://github.com/ekinertac/claude-code-transcripts"
Changelog = "https://github.com/ekinertac/claude-code-transcripts/releases"
Issues = "https://github.com/ekinertac/claude-code-transcripts/issues"
CI = "https://github.com/ekinertac/claude-code-transcripts/actions"

[project.scripts]
claude-code-transcripts = "claude_code_transcripts:main"
cct = "claude_code_transcripts:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-httpx>=0.35.0",
    "syrupy>=5.0.0",
]
